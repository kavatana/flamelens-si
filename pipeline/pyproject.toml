[project]
name = "flamelens-pipeline"
version = "0.1.0"
description = "Reproducible data pipeline for FlameLens SI: NASA PSI combustion investigations -> curated fire-safety dataset"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2",
  "pyyaml>=6.0",
  "pydantic>=2.8",
  "openpyxl>=3.1",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
