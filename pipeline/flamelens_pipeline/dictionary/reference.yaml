# Reference material used to interpret the tests. Every number here is quoted from NASA text;
# the pipeline checks each quote against its source before building.
#
#   source: challenge   NASA's challenge statement
#   source: PSI-20      the PSI record of that investigation

psi_to_kpa: 6.894757

# --- Crew atmospheres drawn on the evidence map ---------------------------------------
environments:
  - id: cabin
    name: Sea-level cabin
    detail: Earth at sea level, and the International Space Station
    o2_fraction: 0.21
    pressure_psi: 14.7
    kind: point
    source: PSI-20
    quote: "14.7 psia, 21 % oxygen"
  - id: airlock
    name: Reduced-pressure cabin
    detail: 10.2 psia with 26.5% oxygen, one of the three atmospheres NASA lists for human missions
    o2_fraction: 0.265
    pressure_psi: 10.2
    kind: point
    source: PSI-20
    quote: "10.2 psia, 26.5 %"
  - id: exploration
    name: Exploration atmosphere
    detail: 8.2 psia with 34% oxygen, the atmosphere planned to shorten spacewalk preparation
    o2_fraction: 0.34
    pressure_psi: 8.2
    kind: point
    source: PSI-20
    quote: "8.2 psia, 34 % oxygen"
  - id: moon-base
    name: Moon Base range
    detail: Oxygen of 30% or more at 10.2 psi or less
    o2_fraction_min: 0.30
    pressure_psi_max: 10.2
    pressure_psi_min: 4.3
    kind: region
    source: challenge
    quote: "The intermediate oxygen concentration used on the Moon will likely be 30% or greater, with a corresponding pressure of 10.2 psi or less."
  - id: spacesuit
    name: Spacesuit
    detail: Pure oxygen at 4.3 psi
    o2_fraction: 1.0
    pressure_psi: 4.3
    kind: point
    source: challenge
    quote: "spacesuits are filled with 100% oxygen to only 4.3 psi"

# --- Scenario presets -----------------------------------------------------------------
scenarios:
  - id: lunar-habitat
    name: Lunar surface habitat
    summary: Exploration atmosphere, with materials as the main concern.
    environment: exploration
    fuel_focus: solid
    priority: prevention
  - id: pressurized-rover
    name: Pressurized rover
    summary: Reduced-pressure cabin, a small volume where detection and suppression matter as much as prevention.
    environment: airlock
    fuel_focus: solid
    priority: balanced
  - id: station
    name: Space station cabin
    summary: Sea-level atmosphere in microgravity, the best-covered case.
    environment: cabin
    fuel_focus: any
    priority: balanced
  - id: suit
    name: Spacesuit
    summary: Pure oxygen at low pressure, far outside what has been tested.
    environment: spacesuit
    fuel_focus: solid
    priority: prevention

# --- Known gaps stated by NASA --------------------------------------------------------
stated_gaps:
  - id: partial-gravity
    title: No partial-gravity data
    text: PSI holds microgravity and normal-gravity results only. Nothing was measured at lunar or Martian gravity.
    source: challenge
    quote: "there is currently no partial-gravity combustion data available in PSI"
  - id: bounding
    title: Lunar gravity can only be bracketed
    text: Until lunar-gravity experiments fly, the two ends of the gravity range are the only bounds.
    source: challenge
    quote: "Microgravity and normal-gravity results could bound what occurs at intermediate gravity levels."

# --- Hardware families ----------------------------------------------------------------
families:
  - id: acme
    name: ACME burners
    facility: Combustion Integrated Rack
    fuel: Gas flames
    text: Six gas-flame experiments shared one modular set of burners and diagnostics.
    source: challenge
    quote: "The six experiments in the ACME project featured flames of gaseous fuels and were all conducted with the same modular set of ACME hardware in the Combustion Integrated Rack (CIR)."
  - id: mdca
    name: Droplet apparatus (MDCA)
    facility: Combustion Integrated Rack
    fuel: Liquid droplets
    text: Three droplet experiments used the same apparatus inside the same rack as ACME.
    source: challenge
    quote: "FLEX, FLEX-2, and the Cool Flames Investigation (CFI) each featured burning droplets of liquid fuel and were conducted with the Multi-user Droplet Combustion Apparatus (MDCA) in the CIR."
  - id: msg-duct
    name: SPICE flow duct
    facility: Microgravity Science Glovebox
    fuel: Solids and gas jets
    text: One small fan-driven wind tunnel, built for SPICE, was reused for solids and for jet flames.
    source: challenge
    quote: "Each of these investigations was conducted within the Microgravity Science Glovebox (MSG) using the modular fan-driven flow duct built for SPICE."
  - id: smoke
    name: Smoke diagnostics
    facility: Microgravity Science Glovebox
    fuel: Heated solids (smoke)
    text: Particle counters and smoke detectors; one of the instruments was first proven in a dust test.
    source: challenge
    quote: "One of the instruments used for smoke detection in the SAME and SAME-R studies was instead used to detect dust in the Dust and Aerosol Measurement Feasibility Test (DAFT and DAFT-2) studies."
  - id: saffire
    name: Saffire flow duct
    facility: Cygnus cargo vehicle
    fuel: Large solid samples
    text: A large flow duct flown in an uncrewed cargo ship after it left the station, so that a big fire could be lit safely.
    source: PSI-98
    quote: "performed on the Orbital Science’s Cygnus resupply vehicle after it deberthed from the ISS"
  - id: ground
    name: Ground studies
    facility: Laboratories and simulation
    fuel: Re-analysis of flight data
    text: Later studies that took flight data from PSI and built models or follow-up experiments on it.
    source: PSI-117
    quote: "use flight data obtained from PSI"

# --- Earth applications ---------------------------------------------------------------
earth_context:
  source: challenge
  quote: "Fine-water-mist extinguishers developed for use on the ISS have practical applications here on Earth, and NASA technology has similarly led to improvements in terrestrial smoke detection and firefighter gear, including protective clothing and air tanks."
earth_themes:
  - id: materials-standards
    name: Material flammability standards
    text: How materials are screened and ranked for fire risk.
  - id: smoke-detection
    name: Smoke detection
    text: What early smoke looks like to a detector, before there is a flame.
  - id: fire-modelling
    name: Fire models
    text: Simulation tools checked against clean microgravity flames, then applied to fires on Earth.
  - id: confined-spaces
    name: Sealed environments
    text: Submarines, aircraft and other places where a fire cannot be escaped.
  - id: clean-combustion
    name: Cleaner combustion
    text: Engines, burners and power plants that waste less fuel and emit less soot.

# --- Measurement vocabulary -----------------------------------------------------------
# Each measurement type is detected in an investigation's PSI text by these patterns; the
# matched words are stored as evidence.
measurements:
  - {id: imaging, name: Flame imaging, pattern: "cameras?|video|imagery|images|photographs?"}
  - {id: radiometry, name: Radiometry, pattern: "radiometers?|radiative flux|flame radiation|heat radiation|radiative heat"}
  - {id: thermocouples, name: Thermocouples, pattern: "thermocouples?"}
  - {id: pyrometry, name: Pyrometry, pattern: "pyrometry|thermometry"}
  - {id: chemiluminescence, name: Chemiluminescence, pattern: "chemilumines[a-z]+|photomultiplier tubes?|OH\\*"}
  - {id: laser-diagnostics, name: Laser diagnostics, pattern: "PLIF|laser extinction"}
  - {id: soot, name: Soot measurement, pattern: "soot volume fractions?|soot temperatures?|soot levels|soot luminosity"}
  - {id: gas-analysis, name: Gas analysis, pattern: "measure oxygen, carbon dioxide|CO2 and O2 mole faction|ambient oxygen concentration"}
  - {id: particle-sizing, name: Particle sizing, pattern: "Transmission Electron microscope|TEM grids|thermophoretic|thermal precipitators"}
  - {id: aerosol-counters, name: Aerosol counters, pattern: "P-Trak|DustTrak|smoke detectors?|ionization detector|condensate nuclei counter"}
  - {id: flow-velocity, name: Flow velocity, pattern: "anemometers?|airflow speeds?|co-flow air velocity|flow velocity"}
  - {id: ion-current, name: Ion current, pattern: "ion current"}
  - {id: heat-flux, name: Heat flux, pattern: "heat flux"}
  - {id: mass-loss, name: Mass loss, pattern: "mass loss|weighed"}
  - {id: droplet-sizing, name: Droplet sizing, pattern: "droplet size measurements|droplet burning rates|extinction diameters?"}
  - {id: simulation, name: Numerical simulation, pattern: "simulations?|CFD|numerical modeling|computational model(?:s|ing)"}
