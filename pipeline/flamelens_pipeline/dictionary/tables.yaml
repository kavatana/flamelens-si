# How each PSI experimental table maps onto the variable dictionary.
#
# One entry per table file. Columns that are not listed are not dropped: every original
# cell is kept with its record and shown in the interface as "original row".
#
# record_kind
#   test      one row is one burn
#   session   one row is a test day on which several flames were lit
#   envelope  one row lists the range of conditions covered, not individual burns
#   dataset   one row points to a published dataset (ground investigations)
#
# constants  values that apply to every row but are not a column of the table.
#   quality: context  - stated in PSI's own description; `evidence` is a verbatim quote
#                       and the pipeline fails if the quote is not found in the source.
#   quality: assumed  - not stated anywhere in PSI; `note` says what was assumed and why.
#                       Assumed values are drawn differently in the interface.
#
# evidence_source: psi (default) | challenge | table

# ======================================================================================
# ACME - gaseous flames in the Combustion Integrated Rack
# ======================================================================================

- file: "PSI-10_Experimental table_Flame Design_Normal Flame.csv"
  accession: PSI-10
  code: fd-normal
  title: Flame Design - normal flames
  record_kind: test
  label: "{Test}"
  constants:
    fuel_phase: {value: gas, quality: context, evidence: "Flames of Gaseous Fuels"}
    geometry: {value: spherical burner, quality: context, evidence: "spherical diffusion flames"}
    o2_basis: {value: ambient, quality: context, evidence: "normal and inverse convection directions"}
  columns:
    "Flame Type": {var: flame_type, map: {"normal": normal, "inverse": inverse}}
    "Fuel": {parse: fuel}
    "Xfuel": {var: fuel_fraction, unit: fraction}
    "mfuel (mg/s)": {var: fuel_flow_mg_s, unit: mg/s}
    "XO2 (init)": {var: o2_fraction, unit: fraction}
    "XO2 (final)": {var: o2_fraction_final, unit: fraction}
    "pinit (atm)": {var: pressure_kpa, unit: atm}
    "mean Zst": {var: stoich_mixture_fraction, unit: ratio}
    "Tad (K)": {var: adiabatic_flame_temp_k, unit: K}

- file: "PSI-10_Experimental table_Flame Design_Inverse Flame.csv"
  accession: PSI-10
  code: fd-inverse
  title: Flame Design - inverse flames
  record_kind: test
  label: "{Test}"
  constants:
    fuel_phase: {value: gas, quality: context, evidence: "Flames of Gaseous Fuels"}
    geometry: {value: spherical burner, quality: context, evidence: "spherical diffusion flames"}
    fuel: {value: ethylene, quality: context, evidence_source: table, evidence: "XC2H4 initial"}
    o2_basis:
      value: oxidizer stream
      quality: context
      evidence: "normal and inverse convection directions"
      note: In an inverse flame the oxidizer flows from the burner into a fuel atmosphere, so this oxygen value is not a cabin-like ambient.
  columns:
    "Flame Type": {var: flame_type, map: {"normal": normal, "inverse": inverse}}
    "XO2": {var: o2_fraction, unit: fraction}
    "mO2 (mg/s)": {var: oxidizer_flow_mg_s, unit: mg/s}
    "XC2H4 initial": {var: fuel_fraction, unit: fraction}
    "pinit (atm)": {var: pressure_kpa, unit: atm}
    "mean Zst": {var: stoich_mixture_fraction, unit: ratio}
    "Tad (K)": {var: adiabatic_flame_temp_k, unit: K}

- file: "PSI-20_Experimental table_ACME BRE.csv"
  accession: PSI-20
  code: bre
  title: Burning Rate Emulator - test days
  record_kind: session
  label: "{Year} {Month} {Date}"
  date_parts: {year: Year, month: Month, day: Date}
  rows:
    notes_column: Notes
  corrections:
    - column: "Oxygen Conc (percent)"
      raw: "3400%"
      value: "34"
      reason: A percent format was applied to the number 34 in the PSI table; the column is already in percent.
    - column: "Oxygen Conc (percent)"
      raw: "2100%"
      value: "21"
      reason: A percent format was applied to the number 21 in the PSI table; the column is already in percent.
  record_note: >-
    Session summary: PSI lists the oxygen levels of the flames that ignited each day, not
    individual burns. The table's own note says chamber pressures were also varied but are
    not identified, so no pressure is assigned.
  constants:
    fuel_phase: {value: gas, quality: context, evidence: "porous circular burners of 25 and 50 mm diameter"}
    geometry: {value: flat porous burner, quality: context, evidence: "porous circular burners of 25 and 50 mm diameter"}
    o2_basis: {value: ambient, quality: context, evidence: "Consider O2/N2 ambients"}
    diluent: {value: N2, quality: context, evidence: "Consider O2/N2 ambients"}
  columns:
    "Burner Size (mm)": {var: size_mm, unit: mm}
    "Fuel Bottle": {parse: fuel}
    "Oxygen Conc (percent)": {var: o2_fraction, unit: percent}
    "Flames Ignited": {var: flames_ignited, unit: count}

