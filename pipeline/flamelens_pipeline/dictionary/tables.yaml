# ======================================================================================
# Solids and jets in the Microgravity Science Glovebox
# ======================================================================================

- file: "PSI-25_Experimental table_BASS-II.csv"
  accession: PSI-25
  code: bass2
  title: BASS-II - solid-fuel burns
  record_kind: test
  label: "{Test #}"
  record_note: >-
    The air speed of each test is read from the Air display column, which NASA's ReadMe for
    this experiment defines as the flow speed measured in the duct, in cm/s. In many tests the
    crew changed the flow while the sample burned, often lowering it until the flame went
    out, so one test can list several speeds. Fan display and flow restrictor settings are
    kept as originally logged.
  constants:
    fuel_phase: {value: solid, quality: context, evidence: "solid fuels burning in low-velocity forced flows in microgravity"}
    o2_basis: {value: ambient, quality: context, evidence: "Ambient oxygen concentration (via working volume nitrogen vitiation)"}
    diluent: {value: N2, quality: context, evidence: "oxygen varied below 21% by adding nitrogen"}
    pressure_kpa:
      value: 101.325
      approx: true
      quality: assumed
      note: Not listed in the PSI table. Taken as ISS cabin pressure, because the experiment ran inside the Microgravity Science Glovebox.
  columns:
    "PI": {var: investigator}
    "Date": {var: test_date, parse: date}
    "Fuel Sample Material": {parse: sample, default_material: PMMA}
    "Calibrated initial O2 % by vol": {var: o2_fraction, unit: percent}
    "Calibrated final O2 % by vol": {var: o2_fraction_final, unit: percent}
    "Final CO2 % by vol": {var: co2_fraction_final, unit: percent}
    "Final CO (ppm)": {var: co_ppm_final, unit: ppm}
    # The cell lists the speeds in the order they were tried, with remarks ("5  3  2  1  low").
    # See parse_flow_steps for exactly which numbers are read. 59 cm/s is the largest air
    # speed in NASA's fan calibration sheet for this duct (documents.yaml).
    "Air display":
      var: flow_speed_cm_s
      parse: flow_steps
      unit: cm/s
      max: 59
      evidence: "Air display:  flow speed measured in the duct in cm/s on the video display."
      evidence_source: doc:bass2-readme
      note: >-
        Read from the duct's air-speed display. NASA notes that this display responds
        slowly, in about a minute, so a reading is only steady after a long time at one
        setting.

